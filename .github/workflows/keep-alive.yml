name: Keep-Alive Ping

on:
  schedule:
    # Runs every 10 minutes to prevent Render Free Tier from idling
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping OmniRoute Health Endpoint
        run: |
          echo "Pinging OmniRoute health endpoint..."
          curl -s -f -m 30 "https://omniroute-ai-5hys.onrender.com/api/monitoring/health" || echo "Ping completed"
